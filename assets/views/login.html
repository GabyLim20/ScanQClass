<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" type="image/png" href="/assets/images/landing/logoMorado.png">
    <link href="../css/login.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/var.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
    <div class="login-container">
        <div class="left-side">
            <div class="left-content">
                <div class="logo">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h2>Bienvenido de nuevo</h2>
                <p>Inicia sesión para acceder a tu cuenta y gestionar tus datos de forma segura.</p>
            </div>
        </div>
        <div class="right-side">
            <div class="card">
                <h2>Iniciar Sesión</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-envelope-fill"></i></span>
                            <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com"
                                required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password" class="form-label">Contraseña</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password"
                                placeholder="Ingresa tu contraseña" required>
                            <button type="button" class="input-group-text bg-light border-0 toggle-password"
                                id="togglePasswordBtn" style="cursor:pointer;">
                                <i class="bi bi-eye-slash-fill" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label" for="remember">Recordar mi cuenta</label>
                    </div>
                    <button type="submit" class="btn-login">Iniciar Sesión</button>
                    <div class="form-footer">
                        <a href="forgot.html">¿Olvidaste tu contraseña?</a>
                        <a href="register.html">Crear una cuenta</a>
                    </div>
                    <div class="terms">
                        <small>
                            Al continuar, aceptas nuestros <a href="/assets/views/terms.html">Términos de uso</a> y <a
                                href="/assets/views/privacy.html">Política de
                                privacidad</a>
                        </small>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/login.js"></script>
</body>

</html>
