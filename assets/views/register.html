<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="/assets/css/login.css">
    <link rel="stylesheet" href="/assets/css/var.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
    <div class="login-container">
        <div class="right-side">
            <div class="card">
                <h2>Crear Cuenta</h2>
                <form id="register-form" novalidate>
                    <div class="form-group mb-3">
                        <label for="name" class="form-label">Nombre</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0">
                                <i class="bi bi-person-fill"></i>
                            </span>
                            <input type="text" class="form-control" id="name" placeholder="Tu nombre" required>
                        </div>
                    </div>

                    <div class="form-group mb-3">
                        <label for="lastname" class="form-label">Apellido</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0">
                                <i class="bi bi-person-fill"></i>
                            </span>
                            <input type="text" class="form-control" id="lastname" placeholder="Tu apellido" required>
                        </div>
                    </div>

                    <div class="form-group mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0">
                                <i class="bi bi-envelope-fill"></i>
                            </span>
                            <input type="email" class="form-control" id="email" placeholder="correo@alumnos.udg.mx"
                                required>
                        </div>
                    </div>

                    <div class="form-group mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password"
                                placeholder="Ingresa tu contraseña" required>
                            <span class="input-group-text bg-light border-0 toggle-password" style="cursor:pointer;">
                                <i class="bi bi-eye-slash-fill" id="togglePassword"></i>
                            </span>
                        </div>
                    </div>

                    <div class="form-group mb-3">
                        <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="confirmPassword"
                                placeholder="Repite tu contraseña" required>
                            <span class="input-group-text bg-light border-0 toggle-password" style="cursor:pointer;">
                                <i class="bi bi-eye-slash-fill" id="toggleConfirm"></i>
                            </span>
                        </div>
                    </div>

                    <div id="form-alert" class="alert d-none" role="alert"></div>

                    <button type="submit" class="btn-login w-100">Registrarse</button>

                    <div class="form-footer mt-3">
                        <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
                    </div>
                </form>
            </div>
        </div>
        <div class="left-side">
            <div class="left-content">
                <div class="logo">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h2>¡Bienvenido!</h2>
                <p>Únete y accede a tu cuenta para gestionar tus datos de forma segura.</p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/register.js"></script>
</body>

</html>
