<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña</title>
    <link href="../css/login.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/var.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body>
    <div class="login-container">
        <div class="left-side">
            <div class="left-content">
                <div class="logo">
                    <img src="../images/landing/logo.png" alt="ScanQClass" style="width:72px;height:72px;object-fit:contain;">
                </div>
                <h2>Nueva Contraseña</h2>
                <p>Escribe una nueva contraseña segura para terminar el proceso de recuperación.</p>
            </div>
        </div>
        <div class="right-side">
            <div class="card">
                <h2>Restablecer Contraseña</h2>
                <form id="reset-form">
                    <div class="form-group">
                        <label for="newPassword" class="form-label">Nueva contraseña</label>
                        <input type="password" class="form-control" id="newPassword" placeholder="Mínimo 8 caracteres" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Repite tu contraseña" required>
                    </div>
                    <button type="submit" class="btn-login">Guardar nueva contraseña</button>
                    <div class="form-footer justify-content-center">
                        <a href="login.html">← Volver al inicio de sesión</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="../js/reset.js"></script>
</body>
</html>
