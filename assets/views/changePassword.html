<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña</title>
    <link rel="icon" type="image/png" href="/assets/images/landing/logoMorado.png">
    <link href="/assets/css/var.css" rel="stylesheet">
    <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/login.css" rel="stylesheet">
    <link href="/assets/css/changePassword.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="changePasswordPage">
    <main class="changePasswordShell">
        <section class="changePasswordPanel">
            <div class="changePasswordBrand">
                <img src="/assets/images/landing/logoMorado.png" alt="ScanQClass" class="changePasswordLogo">
                <div>
                    <h1 class="changePasswordTitle">Actualiza tu contraseña</h1>
                    <p class="changePasswordSubtitle">Debes cambiar tu contraseña para continuar</p>
                </div>
            </div>

            <form id="changePasswordForm" class="changePasswordForm">
                <div class="changePasswordField">
                    <label for="currentPassword" class="form-label">Contraseña actual</label>
                    <div class="input-group changePasswordInputGroup">
                        <span class="input-group-text">
                            <i class="bi bi-lock-fill"></i>
                        </span>
                        <input type="password" class="form-control" id="currentPassword" placeholder="Ingresa tu contraseña actual" required>
                        <button type="button" class="input-group-text changePasswordToggle" data-toggle-password="currentPassword" aria-label="Mostrar u ocultar contraseña actual">
                            <i class="bi bi-eye-slash-fill"></i>
                        </button>
                    </div>
                </div>

                <div class="changePasswordField">
                    <label for="newPassword" class="form-label">Nueva contraseña</label>
                    <div class="input-group changePasswordInputGroup">
                        <span class="input-group-text">
                            <i class="bi bi-key-fill"></i>
                        </span>
                        <input type="password" class="form-control" id="newPassword" placeholder="Mínimo 8 caracteres" minlength="8" required>
                        <button type="button" class="input-group-text changePasswordToggle" data-toggle-password="newPassword" aria-label="Mostrar u ocultar nueva contraseña">
                            <i class="bi bi-eye-slash-fill"></i>
                        </button>
                    </div>
                </div>

                <div class="changePasswordField">
                    <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
                    <div class="input-group changePasswordInputGroup">
                        <span class="input-group-text">
                            <i class="bi bi-check2-circle"></i>
                        </span>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Repite la nueva contraseña" minlength="8" required>
                        <button type="button" class="input-group-text changePasswordToggle" data-toggle-password="confirmPassword" aria-label="Mostrar u ocultar confirmación de contraseña">
                            <i class="bi bi-eye-slash-fill"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login changePasswordSubmit">Guardar contraseña</button>
            </form>

            <div class="changePasswordFooter">
                <button id="logoutBtn" type="button" class="changePasswordLogout">Cerrar sesión</button>
            </div>
        </section>
    </main>

    <script src="/assets/js/changePassword.js"></script>
</body>
</html>
