<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link href="../css/login.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/var.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body>
    <div class="login-container">
        <div class="left-side">
            <div class="left-content">
                <div class="logo">
                    <img src="../images/landing/logo.png" alt="ScanQClass"
                        style="width:72px;height:72px;object-fit:contain;">
                </div>
                <h2>Recuperar Contraseña</h2>
                <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
            </div>
        </div>
        <div class="right-side">
            <div class="card">
                <h2>Recuperar Contraseña</h2>
                <form id="forgot-form">
                    <div class="form-group">
                        <label for="email" class="form-label">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-envelope-fill"></i></span>
                            <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com"
                                required>
                        </div>
                    </div>
                    <button type="submit" class="btn-login">Enviar enlace</button>
                    <div class="form-footer justify-content-center">
                        <a href="login.html">← Volver al inicio de sesión</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="../js/forgot.js"></script>
</body>

</html>
